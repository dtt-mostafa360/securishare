services:
  memcached:
    image: memcached
    restart: always
    expose:
      - "11211"

  yopass:
    image: jhaals/yopass
    restart: always
    depends_on:
      - memcached
    ports:
      - "127.0.0.1:1337:1337"
    command: "--memcached=memcached:11211 --port 1337 --address 0.0.0.0 --trusted-proxies 0.0.0.0/0"
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
